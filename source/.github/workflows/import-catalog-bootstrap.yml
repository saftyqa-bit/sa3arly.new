name: Import catalog bootstrap

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: Expiring HTTPS URL for a UWS JSON or CSV export
        required: true
        type: string
      store_id:
        description: Sa3arly store id
        required: true
        type: string
      external_run_id:
        description: Ultimate Web Scraper run id
        required: true
        type: string
      provider:
        description: Source provider key
        required: true
        default: ultimate_web_scraper
        type: string
      dry_run:
        description: Validate and match without changing mappings
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: sa3arly-prod-972741
  REGION: europe-west1
  DB_INSTANCE: sa3arly-postgres
  DB_SECRET: sa3arly-database-url
  BOOTSTRAP_SERVICE_ACCOUNT: sa3arly-bootstrap@sa3arly-prod-972741.iam.gserviceaccount.com

jobs:
  import:
    name: Download, validate, and import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: ">= 540.0.0"

      - name: Download the expiring UWS export
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
        run: |
          set -euo pipefail
          case "$DOWNLOAD_URL" in
            https://*) ;;
            *) echo 'download_url must use HTTPS' >&2; exit 2 ;;
          esac
          curl --fail-with-body --silent --show-error --location --max-time 300 \
            --output "$RUNNER_TEMP/catalog-export.raw" "$DOWNLOAD_URL"
          python3 - "$RUNNER_TEMP/catalog-export.raw" "$RUNNER_TEMP/catalog-batches" "$RUNNER_TEMP/catalog-export-manifest.json" <<'PY'
          import csv
          import io
          import json
          import sys
          from pathlib import Path

          BATCH_SIZE = 500
          source = Path(sys.argv[1])
          batch_dir = Path(sys.argv[2])
          manifest_path = Path(sys.argv[3])
          text = source.read_text(encoding="utf-8-sig")

          try:
              payload = json.loads(text)
          except json.JSONDecodeError:
              reader = csv.DictReader(io.StringIO(text))
              if not reader.fieldnames:
                  raise SystemExit("CSV export has no header row")
              payload = [dict(row) for row in reader]

          if isinstance(payload, list):
              records = [dict(item) for item in payload]
          elif isinstance(payload, dict):
              records = None
              for key in ("records", "rows", "results", "data"):
                  if isinstance(payload.get(key), list):
                      records = [dict(item) for item in payload[key]]
                      break
              if records is None:
                  raise SystemExit("JSON export has no row array")
          else:
              raise SystemExit("Export has an unsupported root value")

          if not records:
              raise SystemExit("Export contains no rows")
          batch_dir.mkdir(parents=True, exist_ok=True)
          batch_count = 0
          for offset in range(0, len(records), BATCH_SIZE):
              batch_count += 1
              batch = records[offset : offset + BATCH_SIZE]
              (batch_dir / f"batch-{batch_count:04d}.json").write_text(
                  json.dumps(batch, ensure_ascii=False),
                  encoding="utf-8",
              )
          manifest_path.write_text(
              json.dumps({"rows": len(records), "batches": batch_count}),
              encoding="utf-8",
          )
          print(f"Normalized {len(records)} rows into {batch_count} safe batches")
          PY

      - id: deploy_importer
        name: Deploy a private one-use importer
        env:
          STORE_ID: ${{ inputs.store_id }}
          EXTERNAL_RUN_ID: ${{ inputs.external_run_id }}
          PROVIDER: ${{ inputs.provider }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -Eeuo pipefail
          service_name="sa3arly-catalog-import-${GITHUB_RUN_ID}"
          instance_connection="${PROJECT_ID}:${REGION}:${DB_INSTANCE}"

          api_image="$(gcloud run services describe sa3arly-api \
            --project="$PROJECT_ID" --region="$REGION" \
            --format='value(spec.template.spec.containers[0].image)')"
          test -n "$api_image"

          # The temporary service receives only a reference to DATABASE_URL.
          # GitHub never reads the database password or the API's internal token.
          bootstrap_code="$(python3 - <<'PY'
          import base64

          source = r'''
          import json
          import os
          import traceback
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          from app.repository import ingest_catalog_bootstrap
          from app.schemas import CatalogBootstrapImportRequest

          MAX_BODY_BYTES = 30_000_000

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  return

              def send_json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False, sort_keys=True).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/healthz":
                      self.send_json(200, {"ok": True})
                  else:
                      self.send_json(404, {"error": "not_found"})

              def do_POST(self):
                  stage = "request"
                  try:
                      if self.path not in {"/import", "/import/commit"}:
                          self.send_json(404, {"error": "not_found"})
                          return
                      commit_requested = self.path == "/import/commit"
                      if commit_requested and os.environ["DRY_RUN"].casefold() == "true":
                          self.send_json(403, {"error": "commit_disabled"})
                          return
                      length = int(self.headers.get("Content-Length", "0"))
                      if length < 1 or length > MAX_BODY_BYTES:
                          self.send_json(413, {"error": "invalid_body_size"})
                          return

                      stage = "parse_export"
                      payload = json.loads(self.rfile.read(length).decode("utf-8-sig"))
                      if isinstance(payload, list):
                          records = [dict(item) for item in payload]
                      elif isinstance(payload, dict):
                          records = None
                          for key in ("records", "rows", "results", "data"):
                              if isinstance(payload.get(key), list):
                                  records = [dict(item) for item in payload[key]]
                                  break
                          if records is None:
                              raise ValueError("JSON export has no row array")
                      else:
                          raise ValueError("JSON export has an unsupported root value")

                      def build_request(dry_run):
                          return CatalogBootstrapImportRequest(
                              provider=os.environ["PROVIDER"],
                              external_run_id=os.environ["EXTERNAL_RUN_ID"],
                              store_id=os.environ["STORE_ID"],
                              records=records,
                              dry_run=dry_run,
                              metadata={
                                  "source": "private_one_use_cloud_run_service",
                                  "github_run_id": os.environ["GITHUB_ACTION_RUN_ID"],
                              },
                          )

                      stage = "preflight"
                      preview = ingest_catalog_bootstrap(build_request(True))
                      stats = preview["stats"]
                      if stats["rows_received"] != len(records):
                          raise RuntimeError("preflight row count mismatch")

                      result = {
                          "phase": "preflight",
                          "status": preview["status"],
                          "stats": stats,
                          "store": preview["store"],
                      }
                      if commit_requested:
                          stage = "commit"
                          committed = ingest_catalog_bootstrap(build_request(False))
                          result = {
                              "phase": "committed",
                              "status": committed["status"],
                              "import_id": committed["import_id"],
                              "stats": committed["stats"],
                              "store": committed["store"],
                          }
                      self.send_json(200, result)
                  except Exception as exc:
                      traceback.print_exc()
                      self.send_json(
                          500,
                          {"status": "error", "stage": stage, "error_type": type(exc).__name__},
                      )

          ThreadingHTTPServer(("", int(os.environ.get("PORT", "8080"))), Handler).serve_forever()
          '''
          print(base64.b64encode(source.encode()).decode())
          PY
          )"
          launcher="import base64;exec(base64.b64decode('${bootstrap_code}'))"

          gcloud run deploy "$service_name" --project="$PROJECT_ID" \
            --region="$REGION" --image="$api_image" \
            --service-account="$BOOTSTRAP_SERVICE_ACCOUNT" \
            --set-cloudsql-instances="$instance_connection" \
            --set-secrets="DATABASE_URL=${DB_SECRET}:latest" \
            --set-env-vars="^|^STORE_ID=${STORE_ID}|EXTERNAL_RUN_ID=${EXTERNAL_RUN_ID}|PROVIDER=${PROVIDER}|DRY_RUN=${DRY_RUN}|GITHUB_ACTION_RUN_ID=${GITHUB_RUN_ID}" \
            --command=python --args="-c,${launcher}" \
            --cpu=1 --memory=1Gi --min=0 --max=1 --timeout=900 \
            --ingress=all --no-allow-unauthenticated --quiet

          service_url="$(gcloud run services describe "$service_name" \
            --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          test -n "$service_url"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"

      - id: invoke_auth
        name: Mint a one-use importer identity token
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy_importer.outputs.service_url }}

      - name: Run preflight and optional commit
        env:
          IMPORTER_URL: ${{ steps.deploy_importer.outputs.service_url }}
          ID_TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          preflight_dir="$RUNNER_TEMP/catalog-preflight-results"
          mkdir -p "$preflight_dir"
          batch_files=("$RUNNER_TEMP"/catalog-batches/*.json)
          test -e "${batch_files[0]}"

          for batch_file in "${batch_files[@]}"; do
            batch_name="$(basename "$batch_file")"
            result_file="$preflight_dir/$batch_name"
            http_code="$(curl --silent --show-error --max-time 900 \
              --output "$result_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $ID_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$batch_file" \
              "$IMPORTER_URL/import")"
            python3 -m json.tool "$result_file" >/dev/null
            [[ "$http_code" == '200' ]]
          done

          python3 - "$RUNNER_TEMP/catalog-export-manifest.json" "$preflight_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          results = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted(Path(sys.argv[2]).glob("batch-*.json"))
          ]
          if len(results) != manifest["batches"]:
              raise SystemExit("preflight batch count mismatch")

          keys = (
              "rows_received",
              "rows_accepted",
              "rows_rejected",
              "rows_matched",
              "rows_pending_match",
              "url_conflicts",
              "prices_observed",
          )
          stats = {key: sum(int(result["stats"].get(key, 0)) for result in results) for key in keys}
          if stats["rows_received"] != manifest["rows"]:
              raise SystemExit("preflight row count mismatch")
          if stats["rows_accepted"] < 1:
              raise SystemExit("preflight rejected every product row")
          if stats["prices_observed"] < 1:
              raise SystemExit("preflight found no product prices")
          print(json.dumps({"phase": "preflight", "batches": len(results), "stats": stats}, indent=2))
          PY

          if [[ "$DRY_RUN" != "true" ]]; then
            commit_dir="$RUNNER_TEMP/catalog-commit-results"
            mkdir -p "$commit_dir"
            for batch_file in "${batch_files[@]}"; do
              batch_name="$(basename "$batch_file")"
              result_file="$commit_dir/$batch_name"
              http_code="$(curl --silent --show-error --max-time 900 \
                --output "$result_file" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $ID_TOKEN" \
                --header 'Content-Type: application/json' \
                --data-binary "@$batch_file" \
                "$IMPORTER_URL/import/commit")"
              python3 -m json.tool "$result_file"
              [[ "$http_code" == '200' ]]
            done
          fi

      - name: Delete the one-use importer
        if: always()
        run: |
          service_name="sa3arly-catalog-import-${GITHUB_RUN_ID}"
          gcloud run services delete "$service_name" --project="$PROJECT_ID" \
            --region="$REGION" --quiet || true
